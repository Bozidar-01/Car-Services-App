<ion-header class="ion-no-border ion-no-padding" style="padding-top: 5px !important;">
  <ion-toolbar class="ion-no-padding">
      <ion-grid>
    <ion-row class="ion-align-items-center" style="padding: 0 3px;">
      <ion-col>
        <ion-menu-toggle >
        <ion-button style="padding-bottom: 10px;" fill="clear" color="light" class="ion-no-padding">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" transform="matrix(-1, 0, 0, 1, 0, 0)" width="32" height="36">
            <g id="SVGRepo_bgCarrier" stroke-width="0"></g>
            <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g>
            <g id="SVGRepo_iconCarrier">
              <g id="Menu / Menu_Alt_01">
                <path id="Vector" d="M12 17H19M5 12H19M5 7H19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>
              </g>
            </g>
          </svg>
        </ion-button>
      </ion-menu-toggle>
      </ion-col>

      <ion-col *ngIf="isVisible" class="ion-padding-end ion-text-end ion-no-padding ion-no-margin" (click)="goToProfile()">
        <img *ngIf="!user?.profile_pic" style="width: 42px; height: 42px; border-radius: 10px; object-fit: cover;"  src="assets/profile.png" />
        <img *ngIf="user?.profile_pic" style="width: 42px; height: 42px; border-radius: 10px; object-fit: cover;"  [src]="user.profile_pic" />

        </ion-col>
    </ion-row>
    </ion-grid>
  </ion-toolbar>
  </ion-header>
