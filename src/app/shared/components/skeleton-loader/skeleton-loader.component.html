<ng-container *ngIf="type==='cars'">
    <div class="custom-card">
      <ion-skeleton-text  
       animated
        style="width: 100%; height: 100%;"
      ></ion-skeleton-text>      
    </div>
</ng-container>

<ng-container *ngIf="type==='services'">
      <ion-skeleton-text  
      *ngFor="let item of [0,1,2,3,4,5]"
       animated
        style="width: 90%; height: 90px; margin: 0 auto; border-radius: 15px; margin-bottom: 10px !important;"
      ></ion-skeleton-text>      
</ng-container>

<ng-container *ngIf="type==='thirdStepServices'">
      <ion-skeleton-text  
      *ngFor="let item of [0,1,2]"
       animated
        style="width: 90%; height: 80px; margin: 0 auto; border-radius: 15px; margin-bottom: 10px !important;"
      ></ion-skeleton-text>      
</ng-container>
