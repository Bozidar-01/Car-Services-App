<div class="header">

  <ion-row class="ion-justify-content-around" style="width: 97%;">
    <ion-col size="9" style="margin-top: 5px;">
      <div style="display: flex; justify-content: center; align-items: center;">
        <img src="/assets/profile.png" style="height:50px; width: 50px; border-radius: 10px;" />
        <ion-card-subtitle style="font-size: 18px;">
          {{user?.name}} <br> 
          <small style="font-size: 12px;">
            {{user?.email}}
          </small>
        </ion-card-subtitle>
      </div>
    </ion-col>
    <ion-col size="3" class="ion-padding-end ion-text-end ion-no-padding ion-no-margin">
      <ion-menu-toggle>
        <ion-button fill="clear" class="action-button ion-no-padding ion-no-margin" style="opacity: 0.5; margin-top: 5px;">
          <ion-icon style="font-size: 35px !important;" name="close-circle-outline" color="snow"></ion-icon>
        </ion-button>
      </ion-menu-toggle>
    </ion-col>
  </ion-row>
</div>


<div class="content-wrapper">
  <div class="content">

    <ion-menu-toggle>
    <ion-item lines="none" style="margin: 0;" (click)="goHome()">
        <ion-button fill="clear" color="primary" style="font-size: 18px;" >
          <ion-icon name="home-outline" style="margin-right: 10px;"></ion-icon>
          Home
        </ion-button>
    </ion-item>
    </ion-menu-toggle>
    <ion-menu-toggle>
    <ion-item lines="none" style="margin: 0;" (click)="goToProfile()">
        <ion-button fill="clear" color="primary" style="font-size: 18px;" >
          <ion-icon name="person-outline" style="margin-right: 10px;"></ion-icon>
          Profile
        </ion-button>
    </ion-item>
    </ion-menu-toggle>
    <ion-menu-toggle>
    <ion-item lines="none" style="margin: 0;" (click)="logOut()">
        <ion-button fill="clear" color="primary" style="font-size: 18px;" >
          <ion-icon name="exit-outline" style="margin-right: 10px;"></ion-icon>
          Logout
        </ion-button>
    </ion-item>
</ion-menu-toggle>
    <div class="divider"></div>

    <ion-item lines="none" style="font-size: 20px; color: var(--ion-color-primary);margin-bottom: 0 !important;">
      Roadside Assistance 
    </ion-item>

    <ion-item (click)="callNow(assist.contact)" lines="none" button detail="false" *ngFor="let assist of roadsideContacts">
      <ion-label position="stacked"  >
        {{assist.name}}
      </ion-label>
      <p style="font-size: 20px;">
      <ion-icon name="call-outline" style="margin-right: 10px; "></ion-icon>         {{assist.contact}}
    </p>
    <ion-icon color="medium" name="chevron-forward" style="position: absolute; right: 0; top: 50%; transform: translateY(-50%);"></ion-icon>
    </ion-item>

    </div>
    </div>
