<ion-content [fullscreen]="true" scrollY="false">
  <div class="header">
    <ion-row class="ion-no-padding ion-justify-content-center" style="padding-top: 10px; position: relative; overflow: visible;">
      <ion-col size="12" style="position: relative; overflow: visible;">
        <img *ngIf="!user.profile_pic" class="profile-pic" src="assets/profile.png" />
        <img *ngIf="user.profile_pic" class="profile-pic" [src]="user.profile_pic" />
        <ion-button class="ion-no-padding ion-no-margin galleryImg" onclick="document.getElementById('fileInput').click()" fill="clear">
          <ion-icon style="background: #fff; border-radius: 50%; padding: 5px; font-size: 32px;" color="dark" name="image"></ion-icon>
          <input type="file" multiple="false" (change)="popFileChooser($event)" id="fileInput" style="display: none" accept="image/*" />
        </ion-button>
      </ion-col>
    </ion-row>
  </div>

  <div class="content-wrapper">
    <div class="content">

        <form [formGroup]="userForm">

          <ion-item lines="none" style="margin-top: 100px;">
            <ion-card>
              <ion-input (ionBlur)="scrollToTop()" type="text" placeholder="Full Name" formControlName="name"></ion-input>
            </ion-card>
          </ion-item>
          <ion-item lines="none" >
            <ion-card>
              <ion-input (ionBlur)="scrollToTop()" type="text" placeholder="E-mail address" formControlName="email"></ion-input>
            </ion-card>
          </ion-item>
          <ion-item lines="none">
            <ion-card>
              <ion-input (ionBlur)="scrollToTop()" type="password" placeholder="Password" formControlName="password"></ion-input>
            </ion-card>
          </ion-item>
          
        </form>
      <ion-button expand="block" class="saveBtn" (click)="updateUser()">
        Save
    </ion-button>
        </div>
    </div>
</ion-content>
