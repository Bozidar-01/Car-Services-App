<div style="margin-bottom: 80px;">
<ng-container  *ngFor="let service of services">


    <ion-card class="service-card" *ngIf="!service.custom_service && service.default_service && service.status == 'active'">
      <ion-item  lines="none">
        <ion-label>
          {{service.default_service.name}}
          <br>
          <small style="font-size: 14px;">{{ getDaysDifference(service.next_service).text }}</small>
        </ion-label>
        <ion-label slot="end">
          <ion-button fill="outline" (click)="completeServiceModal(service)">
            Complete Service
          </ion-button>
        </ion-label>
      </ion-item>
      
      
    </ion-card>
    
    <ion-card class="service-card"  *ngIf="service.custom_service && service.status == 'active'" >
      
      <ion-item  lines="none">
        <ion-label>
          {{service.custom_service.name}} 
          <br>
          <small style="font-size: 14px;">{{ getDaysDifference(service.next_service).text }}</small>
        </ion-label>
        <ion-label slot="end">
          <ion-button fill="outline" (click)="completeServiceModal(service)">
            Complete Service
          </ion-button>
        </ion-label>
      </ion-item>
      
    </ion-card>
    
  </ng-container>
</div>
