<ion-card class="service-card" *ngFor="let service of services">
  <ion-item lines="none">
      <ion-label>
          {{service.default_service.name}}
        <br>
        <small style="font-size: 14px;">{{ getDaysDifference(service.next_service).text }}</small>
      </ion-label>
      <ion-label slot="end">
        <ion-button fill="outline" (click)="completeServiceModal(service)">
          Complete Service
        </ion-button>
      </ion-label>
  </ion-item>
</ion-card>
