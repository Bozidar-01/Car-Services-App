
<ion-item lines="none" style="padding: 0 10px;">
  <ion-label style="font-weight: bold;">
    Total
  </ion-label>
  <ion-label slot="end">
    <ion-button fill="outline" disabled style="opacity: 1; margin-right: 10px;">
      {{total ? total : 0}} den
    </ion-button>
    <ion-button fill="outline" disabled style="opacity: 1;">
      {{totalEuro ? totalEuro : 0}} Euro
    </ion-button>
  </ion-label>
</ion-item>

<ng-container *ngIf="allMods.length">

  <ion-card class="service-card" *ngFor="let mod of allMods">
    <ion-item lines="none">
      <ion-label>
        {{mod.mod_type}}
        <!-- <br> -->
        <!-- <small style="font-size: 14px;">Used: Dot 4</small> -->
      </ion-label>
      <ion-label slot="end">
        <ion-button fill="outline" disabled style="opacity: 1;">
          {{mod.price}} den
        </ion-button>
      </ion-label>
    </ion-item>
  </ion-card>
  
</ng-container>

<ion-card class="service-card" *ngIf="!allMods.length"  style="text-align: center; justify-content: center; display: flex;">
  <ion-item lines="none" >
   No Mods yet!
  </ion-item>
  </ion-card>
