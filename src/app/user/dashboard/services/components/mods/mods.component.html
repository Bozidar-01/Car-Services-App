<ion-item *ngIf="allMods?.length && loaded" lines="none" style="padding: 0 10px;">
  <ion-label style="font-weight: bold;">
    Total
  </ion-label>
  <ion-label slot="end">
    <ion-button fill="outline" disabled style="opacity: 1; margin-right: 10px;">
      {{total}} den
    </ion-button>
    <ion-button fill="outline" disabled style="opacity: 1;">
      {{totalEuro}} Euro
    </ion-button>
  </ion-label>
</ion-item>

<div style="margin-top: 10px;">
  <app-skeleton-loader [type]="'services'" *ngIf="!loaded"></app-skeleton-loader>
</div>

<div *ngIf="allMods?.length && loaded" style="margin-bottom: 80px;">

  <ion-card class="service-card" *ngFor="let mod of allMods">
    <ion-item lines="none">
      <ion-label>
        {{mod.mod_type}}
        <!-- <br> -->
        <!-- <small style="font-size: 14px;">Used: Dot 4</small> -->
      </ion-label>
      <ion-label slot="end">
        <ion-button fill="outline" disabled style="opacity: 1;">
          {{mod.price}} den
        </ion-button>
      </ion-label>
    </ion-item>
  </ion-card>
</div>

<ion-card class="service-card" *ngIf="!allMods?.length && loaded"  style="text-align: center; justify-content: center; display: flex;">
  <ion-item lines="none" >
   No Mods yet!
  </ion-item>
  </ion-card>
