<ion-header class="ion-no-border" style="background: #fff !important; padding: 10px;">
  <ion-toolbar class="ion-no-border" style="--background: #fff !important;">
    <ion-label slot="start" style="font-size:18px; font-weight: bold;">
      {{type === 'service' ? 'Add a custom service' :  type === 'mod' ? 'Add a mod' : 'Update Km'}}
    </ion-label>
    <ion-buttons slot="end">
        <ion-button (click)="modalCtrl.dismiss()" style="font-size: 22px;">
          <ion-icon name="close-circle-outline"></ion-icon>
        </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>


<ion-content>
  <form *ngIf="type === 'service'" [formGroup]="serviceForm">
    <ion-item lines="none" style="margin-top: 10px;">
      <ion-card>
        <ion-input formControlName="name" style="--placeholder-opacity:1;" type="text" placeholder="Service Name"></ion-input>
      </ion-card>
    </ion-item>
    <ion-item lines="none" style="margin-top: 10px;">
      <ion-card>
        <ion-select formControlName="service_interval" style="width: 100%;" interface="action-sheet" label="Service Interval">
          <ion-select-option [value]="interval" *ngFor="let interval of serviceIntervals">
            {{interval}} km
          </ion-select-option>
        </ion-select>
      </ion-card>
    </ion-item>
  </form>

  <form *ngIf="type === 'mod'" [formGroup]="modForm">
    <ion-item lines="none" style="margin-top: 10px;">
      <ion-card>
        <ion-input formControlName="mod_type" style="--placeholder-opacity:1;" type="text" placeholder="Mod Type"></ion-input>
      </ion-card>
    </ion-item>
    <ion-item lines="none" style="margin-top: 10px;">
      <ion-card>
        <ion-input formControlName="price" style="--placeholder-opacity:1;" type="number" placeholder="Price"></ion-input>
      </ion-card>
    </ion-item>
  </form>

  <form *ngIf="type === 'car'" [formGroup]="carForm">
    <ion-item lines="none" style="margin-top: 10px;">
      <ion-card>
        <ion-input formControlName="car_km" style="--placeholder-opacity:1;" type="text" placeholder="Update Km"></ion-input>
      </ion-card>
    </ion-item>
  </form>
  </ion-content>


<ion-footer style="padding: 10px;">
  <ion-button color="primary" style="width: 95%; margin: 0 auto;" expand="block" shape="round"
  (click)="type === 'service' ? (service ? updateService() : addCustomService()) : type === 'mod' ? addMod() : updateKm()">
    {{type === 'service' ? service ? 'Update' : 'Add Service' : type === 'mod' ? 'Add Mod' : 'Update Km'}}
  </ion-button>
</ion-footer>
