<ion-header class="ion-no-border" style="background: #fff !important; padding: 10px; margin-top: 0 !important; padding-top: 0 !important;">
  <ion-toolbar class="ion-no-border" style="--background: #fff !important;">
    <ion-label slot="start" style="font-size:20px; font-weight: bold;">
      Settings
    </ion-label>
    <ion-buttons slot="end">
      <ion-button (click)="presentAlert()" style="font-size: 16px; --padding-end:25px; --padding-start:25px; margin-right: 10px;" color="danger" fill="outline" shape="round">
        Remove Car
      </ion-button>
        <ion-button (click)="modalCtrl.dismiss({value:services})" style="font-size: 22px;">
          <ion-icon name="close-circle-outline"></ion-icon>
        </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>


<ion-content>

  <ion-list class="ion-padding">
    <ion-card button>

      <ion-item lines="none"  (click)="editService(null,'car')">
          Car Mileage - {{car.car_km}} KM
          <ion-icon slot="end" color="medium" name="chevron-forward-outline"></ion-icon>
      </ion-item>

  
      </ion-card>

    <ion-card *ngFor="let service of services" button>

    <ion-item *ngIf="!service.custom_service && service.default_service" lines="none"  (click)="editService(service,'service')">

        {{service.default_service?.name}} - <b [ngStyle]="{'color': service.status == 'active' || service.status === 'completed' ? 'var(--ion-color-success)' : 'var(--ion-color-danger)'}" style="text-transform: capitalize; padding-left: 5px;">{{service.status == 'active' || service.status === 'completed' ? 'Active' : 'Inactive'}}</b>

        <ion-icon slot="end" color="medium" name="chevron-forward-outline"></ion-icon>

    </ion-item>

    <ion-item *ngIf="service.custom_service" lines="none"  (click)="editService(service,'service')">

        {{service.custom_service.name}} - <b [ngStyle]="{'color': service.status == 'active' || service.status === 'completed' ? 'var(--ion-color-success)' : 'var(--ion-color-danger)'}" style="text-transform: capitalize; padding-left: 5px;">{{service.status == 'active' || service.status === 'completed' ? 'Active' : 'Inactive'}}</b>

        <ion-icon slot="end" color="medium" name="chevron-forward-outline"></ion-icon>

    </ion-item>

    </ion-card>

  </ion-list>

</ion-content>
