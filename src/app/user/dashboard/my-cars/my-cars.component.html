<swiper-container 
#swiperRef
class="swiper-container"
slides-per-view="1.2" 
centered-slides="true"
space-between="15"
>
<ng-container *ngIf="!myCars?.length && showLoader">
  <swiper-slide  class="swiper-slide" *ngFor="let item of [0,1,2,3,4]">
    <app-skeleton-loader [type]="'cars'"></app-skeleton-loader>
  </swiper-slide>
</ng-container>

<ng-container *ngIf="!myCars?.length && !showLoader">
  <swiper-slide  class="swiper-slide">
    <div class="custom-card">
    <h2  style="width: 100%; height: 100%; margin: 0; text-align: center; display: flex;justify-content: center;
        align-items: center;">
      No Cars Available
  </h2>      
  </div>
  </swiper-slide>
</ng-container>

<ng-container *ngIf="myCars?.length">
  <swiper-slide class="swiper-slide" *ngFor="let car of myCars">
    <div class="custom-card">
      <ion-card-subtitle style="text-transform: none; font-size: 22px; padding: 15px; font-weight: 600;" color="dark">
        {{ car?.car_model?.cars.model.split(' ')[0] }}
      </ion-card-subtitle>
      <ion-chip *ngIf="car.main_car == 1" name="alert-circle-outline" color="medium" style="position: absolute; top: 35px; right: 60px; z-index: 99; font-size: 10px;">
        Daily Driver
      </ion-chip>

      <ion-icon *ngIf="carsInNeedOfService?.includes(car.id)" slot="end" name="alert-circle-outline" color="warning" style="position: absolute; top: 43px; right: 20px; z-index: 99; font-size: 26px;"></ion-icon>
      <ion-img *ngIf="!car.image" src="assets/car.png"></ion-img>
      <ion-img *ngIf="car.image" [src]="car.image"></ion-img>
      <ion-card-subtitle style="text-transform: none; font-size: 20px; padding: 15px; font-weight: 550; position: absolute; bottom: 65px; left: 50%; transform: translate(-50%);" color="dark">
        {{ car?.car_model?.cars.model.split(' ')[1] }}
      </ion-card-subtitle>
      <ion-button 
      expand="block" 
      shape="round" 
      color="primary" 
      class="view-details-button"
      (click)="viewServices(car)">
      Track Services
    </ion-button>
  </div>
</swiper-slide>
</ng-container>
</swiper-container>



<ion-card *ngIf="count>0" class="service">

  <ion-item lines="none" >
     {{count}} {{count > 1 ? 'Cars' : 'Car'}} {{count > 1 ? 'Need' : 'Needs'}} Attention 
      <ion-icon slot="end" name="alert-circle-outline" color="warning"></ion-icon>
  </ion-item>

  </ion-card>
<ion-card *ngIf="count==0 && myCars?.length" class="serviced">

  <ion-item lines="none" >
      {{myCars?.length>1 ? 'Cars' : 'Car'}} Serviced!
      <ion-icon slot="end" name="checkmark-circle-outline" color="success"></ion-icon>
  </ion-item>

  </ion-card>
