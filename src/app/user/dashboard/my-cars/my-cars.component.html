<swiper-container 
class="swiper-container"
slides-per-view="1.2" 
centered-slides="true"
space-between="15"
>
<swiper-slide class="swiper-slide" *ngFor="let car of [0,1]">
  <div class="custom-card">
    <ion-card-subtitle style="text-transform: none; font-size: 22px; padding: 15px; font-weight: 600;" color="dark">
      Audi
    </ion-card-subtitle>
    <ion-img src="assets/car.png"></ion-img>
    <ion-card-subtitle style="text-transform: none; font-size: 20px; padding: 15px; font-weight: 550; position: absolute; bottom: 65px; left: 50%; transform: translate(-50%);" color="dark">
      A6
    </ion-card-subtitle>
    <ion-button 
    expand="block" 
    shape="round" 
    color="primary" 
    class="view-details-button"
    (click)="viewServices()">
    Track Services
  </ion-button>
  </div>
</swiper-slide>
</swiper-container>



<ion-card button>

  <ion-item lines="none">
      1 Car needs attention 
      <ion-icon slot="end" name="alert-circle-outline" color="warning"></ion-icon>
  </ion-item>

  </ion-card>
