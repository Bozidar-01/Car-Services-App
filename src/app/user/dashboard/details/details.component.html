<ion-header class="ion-no-border" style="background: #fff !important; padding: 10px;">
  <ion-toolbar class="ion-no-border" style="--background: #fff !important;">
    <ion-label slot="start" style="font-size:22px; font-weight: bold;">
      Details
    </ion-label>
    <ion-buttons slot="end">
        <ion-button (click)="modalCtrl.dismiss()" style="font-size: 22px;">
          <ion-icon name="close-circle-outline"></ion-icon>
        </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>
<ion-content>
<ion-item lines="none">
  <ion-label style="font-size:22px; font-weight: bold; color: var(--ion-color-primary);">
    Choose your engine
  </ion-label>
</ion-item>


<ion-item *ngFor="let engine of engines" lines="none" button>
  <ion-label>
    <b style="color: var(--ion-color-primary);">Engine</b> <br>
    {{engine.engine}}
  </ion-label>
  <ion-label>
    <b style="color: var(--ion-color-primary);">Power</b> <br>
    {{engine.power}}
  </ion-label>
</ion-item>
</ion-content>

<ion-footer style="padding: 10px;">
  <ion-item lines="none">
    <ion-label style="font-size:14px; font-weight: bold; color: var(--ion-color-primary);">
      You have selected 2.7TDI with 190Hp
    </ion-label>
  </ion-item>
  <ion-button color="primary" style="width: 95%; margin: 0 auto;" expand="block" shape="round"
   (click)="modalCtrl.dismiss()">
    Confirm
  </ion-button>
</ion-footer>
