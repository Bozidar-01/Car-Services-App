
      <swiper-container 
      class="swiper-container"
      slides-per-view="1.2" 
      centered-slides="true"
      space-between="15"
    >
    <ng-container *ngIf="selectedFilter == 'cars'">

      <swiper-slide  class="swiper-slide" *ngFor="let car of cars">
        <div class="custom-card">
          <ion-card-subtitle style="text-transform: none; font-size: 22px; padding: 15px; font-weight: 600;" color="dark">
            {{ car.model.split(' ')[0] }}
          </ion-card-subtitle>
          <ion-img src="assets/car.png"></ion-img>
          <ion-card-subtitle style="text-transform: none; font-size: 20px; padding: 15px; font-weight: 550; position: absolute; bottom: 65px; left: 50%; transform: translate(-50%);" color="dark">
            {{ car.model.split(' ')[1] }}
          </ion-card-subtitle>
          <ion-button 
          expand="block" 
          shape="round" 
          color="primary" 
          class="view-details-button"
          (click)="getCarModels(car.id)">
          View Details
        </ion-button>
      </div>
    </swiper-slide>
    
  </ng-container>

    <ng-container *ngIf="selectedFilter == 'brands'">

      <swiper-slide  class="swiper-slide" *ngFor="let brand of carBrands">
        <div class="custom-card">
          <ion-card-subtitle style="text-transform: none; font-size: 22px; padding: 15px; font-weight: 600;" color="dark">
            {{ brand.name }}
          </ion-card-subtitle>
          <ion-img src="assets/car.png"></ion-img>
          <ion-card-subtitle style="text-transform: none; font-size: 20px; padding: 15px; font-weight: 550; position: absolute; bottom: 65px; left: 50%; transform: translate(-50%);" color="dark">
            {{ brand.country }}
          </ion-card-subtitle>
          <ion-button 
          expand="block" 
          shape="round" 
          color="primary" 
          class="view-details-button"
          (click)="viewDetails()">
          View Cars
        </ion-button>
      </div>
    </swiper-slide>
    
  </ng-container>

    </swiper-container>
    
    
<ion-item lines="none" style="margin-top: 20px; margin-bottom: 10px;">
<ion-icon name="filter" style="margin-bottom: 2px; margin-right: 10px;"></ion-icon>  <ion-label style="font-size: 22px; font-weight: bold;">Filter</ion-label> 
<ion-label slot="end" color="medium" style="font-size: 12px; font-weight: normal;">
<ion-button fill="clear" class="ion-no-padding" (click)="toggleCard($event,'cars')">
  Reset
</ion-button>  
</ion-label> 
</ion-item>

  <ion-row class="ion-no-padding ion-no-margin ion-justify-content-center">
    <ion-col size="6" class="ion-no-padding ion-no-margin">
      <div class="custom-filter-card" (click)="toggleCard($event,'brands')">
        <ion-img src="assets/brands.jpg"></ion-img>
        <div class="subtitle-overlay"></div>
        <ion-card-subtitle>
          Brands
        </ion-card-subtitle>
      </div>
      
      </ion-col>
      <ion-col size="6" class="ion-no-padding ion-no-margin">
        <div class="custom-filter-card" (click)="toggleCard($event,'cars')">
          <ion-img src="assets/brands.jpg"></ion-img>
          <div class="subtitle-overlay"></div>
          <ion-card-subtitle>
            Cars
          </ion-card-subtitle>
        </div>
        </ion-col>
  </ion-row>
