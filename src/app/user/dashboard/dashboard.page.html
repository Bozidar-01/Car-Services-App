<ion-content scrollY="false">
  <div class="header">
    <ion-card-subtitle style="text-transform: none; font-size: 28px; z-index: 3; line-height: 1.2; position: absolute; left: 20px; bottom: 20px;" color="snow">
        Car Service Tracker
    </ion-card-subtitle>
  </div>

  <div class="content-wrapper">
    <div class="content">

      <ion-segment  [value]="carsSegment" (ionChange)="changeSegment($event)">
        <ion-segment-button value="available">
          <ion-label>Available Cars</ion-label>
        </ion-segment-button>
        <ion-segment-button value="own">
          <ion-label>My Cars</ion-label>
        </ion-segment-button>
      </ion-segment>


      <div *ngIf="carsSegment == 'available'" [@fadeInOut]>
        <app-available-cars></app-available-cars>
      </div>

      <div *ngIf="carsSegment == 'own'" [@fadeInOut]>
        <app-my-cars></app-my-cars>
      </div>

 </div>
 </div>
  
</ion-content>
