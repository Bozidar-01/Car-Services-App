<ion-card-subtitle color="dark" style="text-align: center; text-transform: none; font-size: 40px; margin-bottom: 30px;">
  Register
</ion-card-subtitle>



<ion-list>

  <form [formGroup]="registerForm">
    <ion-item lines="none">
      <ion-card>
        <ion-item lines="none" class="ion-no-padding">
        <ion-input formControlName="name" type="text" placeholder="Full Name"></ion-input>
        </ion-item>
      </ion-card>
  </ion-item>
  <ion-item lines="none">
      <ion-card>
        <ion-item lines="none" class="ion-no-padding">
        <ion-input formControlName="email" type="text" placeholder="E-mail address"></ion-input>
        </ion-item>
      </ion-card>
  </ion-item>
  <ion-item lines="none">
      <ion-card>
        <ion-item lines="none" class="ion-no-padding">
        <ion-input [type]="showPassword ? 'text' : 'password'" formControlName="password" type="password" placeholder="Password"></ion-input>
        <ion-buttons slot="end" style="transform: translateX(20px);
        ">
            <ion-button (click)="showPassword = !showPassword">
              <ion-icon  slot="icon-only" name="{{ !showPassword ? 'eye-outline' : 'eye-off-outline'}}"></ion-icon>
            </ion-button>
          </ion-buttons>
        </ion-item>
      </ion-card>
  </ion-item>
  <ion-item lines="none">
      <ion-card>
        <ion-item lines="none" class="ion-no-padding">
        <ion-input [type]="showPassword ? 'text' : 'password'" formControlName="password_confirmation" type="password" placeholder="Confirm Password"></ion-input>
        <ion-buttons slot="end" style="transform: translateX(20px);
        ">
            <ion-button (click)="showPassword = !showPassword">
              <ion-icon  slot="icon-only" name="{{ !showPassword ? 'eye-outline' : 'eye-off-outline'}}"></ion-icon>
            </ion-button>
          </ion-buttons>
        </ion-item>
      </ion-card>
  </ion-item>
  </form>

  <ion-button class="register" expand="block" (click)="register()">
      Register
  </ion-button>

  <div class="divider"></div>


  <ion-button fill="clear" expand="block" (click)="login()" class="ion-no-padding ion-no-margin" style="font-size: 12px;">
    Have an account? Login!
</ion-button>
  
</ion-list>
